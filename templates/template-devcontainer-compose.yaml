# ----------------------------------------------------------------
# VOLUMES
# ----------------------------------------------------------------

volumes:
  # named volume for the MongoDB data (default settings)
  dbdata:

# ----------------------------------------------------------------
# SERVICES
# ----------------------------------------------------------------

services:
  # --------------------------------
  # SERVICE: WORKSPACE
  # --------------------------------
  app:
    # NOTE: a Dockerfile, not dockerfile_inline, as the devcontainer CLI reads it to extend the image
    build: .

    env_file:
      # NOTE: compose runs from /.devcontainer, so the repo-root .env is only read via env_file (no interpolation).
      - path: ../.env
        required: false

    # the db is internal to the container network, hence without auth
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ""

    # published for the devcontainer CLI, which ignores forwardPorts (VS Code and Codespaces forward them);
    # bound to 127.0.0.1, so they are not reachable from the network
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3001:3001"

    volumes:
      - "..:/workspace:cached"

    command: sleep infinity

  # --------------------------------
  # SERVICE: MongoDB
  # --------------------------------
  db:
    image: mongo:9

    volumes:
      - dbdata:/data/db
      - ../db/schema.js:/docker-entrypoint-initdb.d/schema.js:ro
