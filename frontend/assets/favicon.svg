<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- globe with the square marker of a capital (cf. .marker.capital in /frontend/src/styles.css) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e88e5" />
      <stop offset="1" stop-color="#0b3466" />
    </linearGradient>
    <clipPath id="globe">
      <circle cx="27" cy="37" r="19" />
    </clipPath>
    <mask id="cutout">
      <rect width="64" height="64" fill="#fff" />
      <rect x="33" y="3" width="28" height="28" rx="3" fill="#000" />
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <g fill="none" stroke="#fff" mask="url(#cutout)">
    <circle cx="27" cy="37" r="19" stroke-width="3.5" />
    <g clip-path="url(#globe)" stroke-width="2.5" stroke-opacity="0.6">
      <ellipse cx="27" cy="37" rx="8.5" ry="19" />
      <path d="M8 37h38M8 27h38M8 47h38" />
    </g>
  </g>
  <rect x="37" y="7" width="20" height="20" rx="1.5" fill="#ffb300" stroke="#fff" stroke-width="3.5" />
  <rect x="42" y="12" width="10" height="10" fill="none" stroke="#10243d" stroke-width="2" />
</svg>
