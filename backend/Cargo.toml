[package]
name = "backend"
version = "1.4.1"
edition = "2024"
rust-version = "1.89.0"
description = "REST API for capitals and other cities (axum + MongoDB)"
homepage = "https://github.com/raj-open/example-capitals"
license = "MPL-2.0"
publish = false

# ----------------------------------------------------------------
# DEPENDENCIES
# ----------------------------------------------------------------

# NOTE: TLS via rustls with the `ring` provider (as the MongoDB driver), so no C toolchain beyond a linker is needed
[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
mongodb = { version = "3.10.1", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
unicode-normalization = "0.1"
uuid = { version = "1.29.3", features = ["v5"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# ----------------------------------------------------------------
# PROFILES
# ----------------------------------------------------------------

# small release binary
[profile.release]
lto = "thin"
strip = true
