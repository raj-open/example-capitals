[package]
name = "backend"
version = "2.0.0"
edition = "2024"
rust-version = "1.97"
description = "REST API for capitals and other cities (axum + MongoDB)"
homepage = "https://github.com/raj-open/example-capitals"
license = "MPL-2.0"
publish = false
default-run = "backend"

# ----------------------------------------------------------------
# TARGETS
# ----------------------------------------------------------------

# the app (routes, services, db), also for the tests
[lib]
name = "backend"
path = "src/lib.rs"

# the server
[[bin]]
name = "backend"
path = "src/main.rs"
required-features = ["server"]

# the generator of the API types (`just build-models-backend`)
[[bin]]
name = "codegen"
path = "src/bin/codegen/main.rs"
required-features = ["codegen"]

# ----------------------------------------------------------------
# PROFILES
# ----------------------------------------------------------------

# development (`cargo build`, `cargo run`): fast to compile, with debug info and checks
[profile.dev]
debug = true
strip = false
opt-level = 0
lto = false
codegen-units = 256
incremental = true

# tests (`cargo test`): as development
[profile.test]
debug = true
strip = false
opt-level = 0
lto = false
codegen-units = 256
incremental = true

# optimised release binary (`just build`)
[profile.release]
debug = false
strip = false
opt-level = 3
lto = true # link-time optimisation
codegen-units = 1
incremental = false

# ----------------------------------------------------------------
# FEATURES
# ----------------------------------------------------------------

# bundles of dependencies, by what is built:
# `server` for the app (lib, server, tests), `codegen` for the generator,
# which so builds without the generated types (`--no-default-features --features codegen`)
[features]
default = ["server"]
server = [
  "dep:axum",
  "dep:dotenvy",
  "dep:futures-util",
  "dep:mongodb",
  "dep:regress",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:unicode-normalization",
  "dep:uuid",
]
codegen = [
  "dep:prettyplease",
  "dep:schemars",
  "dep:serde_yaml_ng",
  "dep:syn",
  "dep:typify",
]

# ----------------------------------------------------------------
# DEPENDENCIES
# ----------------------------------------------------------------

[dependencies]
# both
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# server
# NOTE: TLS via rustls with the `ring` provider (as the MongoDB driver), so no C toolchain beyond a linker is needed
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
mongodb = { version = "3.10.1", default-features = false, features = ["compat-3-0-0", "rustls-tls"], optional = true }
regress = { version = "0.12", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
uuid = { version = "1.29.3", features = ["v5"], optional = true }

# codegen
prettyplease = { version = "0.3", optional = true }
# NOTE: 0.8 as typify takes its types; do not upgrade apart from typify
schemars = { version = "0.8.22", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
syn = { version = "3", features = ["full"], optional = true }
typify = { version = "0.10.1", default-features = false, optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
